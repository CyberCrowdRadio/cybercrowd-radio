<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Market | CyberCrowd Radio</title><link rel="stylesheet" href="style.css"></head>
<body><main class="section" style="max-width:850px;margin:auto;padding:24px">
<a href="palm.html">My Palm</a><h1>Creator Market</h1>
<p id="notice" role="status">Opening your account…</p>
<div id="owner" hidden><label>Project <select id="project"></select></label>
<form id="marketForm">
<label>Product ID <input id="productId" maxlength="120" required></label>
<label>Product title <input id="title" maxlength="300" required></label>
<label>Price (USD) <input id="price" type="number" step=".01" min="0" required></label>
<label>Existing product URL <input id="productUrl" type="url" placeholder="https://"></label>
<button>Save draft</button></form><h2>My drafts</h2><ul id="drafts"></ul>
<button type="button" id="recover">Recover earlier market drafts</button></div>
</main><script src="cc-authority.js"></script><script src="cc-owner-tools.js"></script><script src="uidl-market.js"></script></body></html>
