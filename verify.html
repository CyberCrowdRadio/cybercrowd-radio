<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Email Confirmed — Cybercrowd Radio</title>
  <meta name="description" content="Your Cybercrowd Radio email is confirmed." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='6' fill='%231a120b' stroke='%23c9a227' stroke-width='5'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23c9a227' stroke-width='4'/><circle cx='50' cy='50' r='5' fill='%23a93226'/></svg>" />
</head>
<body class="landing">
  <main class="landing-wrap">
    <section class="signup-card" aria-label="Email confirmation">
      <p class="eyebrow">Cybercrowd Radio</p>
      <h1 class="landing-h1" id="verifyTitle">Checking…</h1>
      <p class="landing-sub" id="verifySub">Confirming your email.</p>
      <div id="verifyCta" hidden>
        <a class="enter-btn" href="station.html">ENTER THE STATION</a>
      </div>
      <p class="back-line"><a href="index.html">← Back to the entrance</a></p>
    </section>
  </main>
  <footer class="landing-foot">
    <p class="footer-brand">CYBERCROWD&nbsp;RADIO</p>
    <p class="footer-copy">© <span id="year">2026</span> Cybercrowd Radio. All rights reserved.</p>
  </footer>
  <script>
    (function () {
      document.getElementById("year").textContent = new Date().getFullYear();
      var title = document.getElementById("verifyTitle");
      var sub = document.getElementById("verifySub");
      var cta = document.getElementById("verifyCta");
      var token = new URLSearchParams(window.location.search).get("token") || "";
      if (!token) {
        title.textContent = "No link found.";
        sub.textContent = "That confirmation link is missing or broken — head back and sign up again.";
        return;
      }
      fetch("/api/verify-email?token=" + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.success) {
            try {
              localStorage.setItem("cybercrowd-verified", "1");
              if (data.email) localStorage.setItem("cybercrowd-email", data.email);
            } catch (e) {}
            title.textContent = "You're in.";
            sub.textContent = "Email confirmed — the station is yours.";
            cta.hidden = false;
          } else {
            title.textContent = "Link expired.";
            sub.textContent = "That confirmation link is old or invalid — sign up again and we'll send a fresh one.";
          }
        })
        .catch(function () {
          title.textContent = "Couldn't reach us.";
          sub.textContent = "Check your connection and try the link again.";
        });
    })();
  </script>
</body>
</html>
