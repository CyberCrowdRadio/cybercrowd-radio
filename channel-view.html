<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Channel | CyberCrowd Radio</title><link rel="stylesheet" href="style.css"><style>
.channel-view{max-width:900px;margin:auto;padding:24px}.channel-stage{min-height:220px;background:#111;color:#fff;padding:16px;border-radius:12px}.channel-stage video{width:100%;max-height:65vh}.channel-stage audio{width:100%}.channel-actions{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.channel-actions button,.channel-actions a{min-height:44px;padding:10px}.channel-disconnect{border:2px solid #ff757c;border-radius:999px;color:#fff;background:radial-gradient(ellipse at 30% 25%,#b72b32,#4b070a);font-weight:700}.channel-exit{touch-action:none}
</style></head><body><main class="channel-view">
<a id="creatorBack" href="channels.html">← Channels</a><h1 id="creatorTitle">Creator Channel</h1><p id="creatorDescription"></p>
<p id="creatorStatus" role="status" aria-live="polite">Loading channel…</p>
<div class="channel-stage" id="creatorStage"></div>
<div class="channel-actions"><button id="creatorEnter" type="button" hidden>Enter</button><button class="channel-disconnect" id="creatorStop" type="button" disabled>Disconnect</button><button class="channel-exit" id="creatorExit" type="button">↑ Exit channel</button><a href="station.html">Listen to CyberCrowd Radio</a><a href="channel-department.html">My channel dashboard</a></div>

</main><script src="config.js"></script><script src="cc-channel-view.js"></script></body></html>
