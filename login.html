<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member Sign In | CyberCrowd Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background:#0a0a0a; color:#e9c979; font-family:Georgia,serif; margin:0; padding:40px 20px; text-align:center; }
    .card { max-width:400px; margin:0 auto; background:#111; border:3px solid #c9a227; border-radius:16px; padding:30px 25px; }
    h1 { margin:0 0 10px; font-size:1.5rem; }
    p.sub { color:#999; margin:0 0 20px; font-size:0.9rem; }
    label { display:block; text-align:left; margin:12px 0 5px; font-weight:bold; font-size:0.85rem; color:#c9a227; }
    input[type="email"], input[type="password"] { width:100%; padding:12px; font-size:1rem; border:2px solid #c9a227; border-radius:8px; background:#1a1a1a; color:#fff; box-sizing:border-box; }
    .keep { display:flex; align-items:center; gap:8px; margin:15px 0; text-align:left; }
    .keep input { width:18px; height:18px; }
    .keep label { margin:0; font-weight:normal; color:#ccc; font-size:0.9rem; }
    button { width:100%; padding:13px; margin-top:10px; font-size:1rem; font-weight:bold; color:#000; background:linear-gradient(180deg,#ffd700,#cc8800); border:none; border-radius:8px; cursor:pointer; }
    .status { color:#f44336; font-size:0.85rem; margin-top:10px; min-height:20px; }
    a { color:#c9a227; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Member Sign In</h1>
    <p class="sub">Welcome back to the station.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="yourname@mymail.com" autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
      <div class="keep">
        <input type="checkbox" id="keepSignedIn">
        <label for="keepSignedIn">Keep me signed in for 2 weeks</label>
      </div>
      <button type="submit">Sign In</button>
      <p class="status" id="status"></p>
    </form>
    <p style="margin-top:20px;"><a href="signup.html">New here? Sign up</a></p>
    <p><a href="station.html">← Back to the station</a></p>
  </div>

<script>
// Check existing session on load
(function() {
  try {
    var session = JSON.parse(localStorage.getItem('ccr-session') || 'null');
    if (session && session.expires > Date.now()) {
      // Still valid — go to station
      window.location.href = 'station.html';
    } else if (session) {
      // Expired — clear it
      localStorage.removeItem('ccr-session');
    }
  } catch (_) {}
})();

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var keep = document.getElementById('keepSignedIn').checked;
  var status = document.getElementById('status');

  if (!email || !password) {
    status.textContent = 'Enter your email and password.';
    return;
  }

  // TODO: Verify password against backend (server-side check)
  // For now, check against locally stored email
  try {
    var storedEmail = (localStorage.getItem('ccr-email') || '').toLowerCase();
    if (storedEmail && storedEmail !== email) {
      status.textContent = 'No account found for this email on this device.';
      return;
    }
    // Create session: 2 weeks if "keep me signed in", else 24 hours
    var duration = keep ? (14 * 24 * 60 * 60 * 1000) : (24 * 60 * 60 * 1000);
    var session = {
      email: email,
      created: Date.now(),
      expires: Date.now() + duration,
      keepSignedIn: keep
    };
    localStorage.setItem('ccr-session', JSON.stringify(session));
    localStorage.setItem('ccr-email', email);
    // Add to verified list so ENTER goes to station
    var list = JSON.parse(localStorage.getItem('cybercrowd-list') || '[]');
    if (list.indexOf(email) === -1) list.push(email);
    localStorage.setItem('cybercrowd-list', JSON.stringify(list));
    window.location.href = 'station.html';
  } catch (err) {
    status.textContent = 'Sign in failed. Try again.';
  }
});
</script>
</body>
</html>
